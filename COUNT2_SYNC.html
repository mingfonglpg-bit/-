<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 COUNT · 品項數量 × 庫位對應</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #06b6d4; --bg: #0f172a; --card: rgba(30,41,59,.85);
            --text: #f8fafc; --dim: #94a3b8; --border: rgba(255,255,255,.1);
            --ok: #10b981; --warn: #f59e0b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
        h1 { font-size: 1.5rem; margin: 0 0 6px; }
        .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
        .btn {
            background: #1e293b; color: var(--text); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px;
        }
        .btn:hover { border-color: var(--primary); }
        .btn-main { background: linear-gradient(135deg, #06b6d4, #3b82f6); border: none; color: #fff; font-weight: 600; }
        .btn-tab.active { background: rgba(6,182,212,.2); border-color: var(--primary); color: var(--primary); }
        input.search {
            flex: 1; min-width: 160px; background: #1e293b; border: 1px solid var(--border);
            border-radius: 10px; padding: 9px 14px; color: var(--text); font-size: 14px;
        }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
        th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: rgba(6,182,212,.12); color: var(--primary); font-weight: 600; position: sticky; top: 0; }
        tr:hover td { background: rgba(255,255,255,.03); }
        a.name-link { color: #67e8f9; text-decoration: none; font-weight: 600; }
        a.name-link:hover { text-decoration: underline; }
        .slot-tag {
            display: inline-block; background: rgba(16,185,129,.15); color: #6ee7b7;
            border: 1px solid rgba(16,185,129,.35); border-radius: 8px; padding: 2px 8px; font-size: 12px;
        }
        .slot-empty { color: var(--dim); font-size: 12px; }
        .map-btn { font-size: 12px; padding: 4px 10px; }
        .qty { font-variant-numeric: tabular-nums; font-weight: 600; }
        .qty.zero { color: var(--dim); }
        .source { font-size: 11px; color: var(--dim); }
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
            z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .modal-box {
            background: #1e293b; border: 1px solid var(--border); border-radius: 20px;
            padding: 24px; width: 92%; max-width: 420px;
        }
        .modal-box h3 { margin: 0 0 12px; color: var(--primary); }
        .modal-box label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 4px; }
        .modal-box select, .modal-box input {
            width: 100%; margin-bottom: 12px; background: #0f172a; border: 1px solid var(--border);
            border-radius: 10px; padding: 10px; color: var(--text);
        }
        .row-btns { display: flex; gap: 10px; margin-top: 8px; }
        .row-btns .btn { flex: 1; text-align: center; }
        .stats { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
        .hint { background: rgba(6,182,212,.08); border: 1px solid rgba(6,182,212,.25); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--dim); margin-bottom: 16px; }
        @media (max-width: 640px) {
            th:nth-child(3), td:nth-child(3) { display: none; }
            .wrap { padding: 12px 10px 40px; }
        }
    
/* === COUNT2 ↔ ANDROID67 數量同步 === */
.qty-input{width:100px;background:#0f172a;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 8px;font-weight:700;text-align:center}
.qty-save{padding:6px 10px;border-radius:8px;border:0;background:#10b981;color:#fff;cursor:pointer;font-weight:700}
.qty-edit-wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
    <h1>📦 COUNT · 品項數量 × 庫位對應</h1>
    <p class="sub">資料來源：count1 相同 CSV（冷凍 / 冷藏常溫 / 冷藏牛）。點品名可開庫位系統搜尋；可手動對應儲位後一鍵跳轉。</p>

    <div class="hint">
        🔗 連結規則：有對應儲位時 → 開啟 <b>ANDROID67_SYNC</b> 並自動搜尋該儲位；無對應時 → 以品名搜尋。<br>
        對應資料存在本機 localStorage（key: <code>count_slot_map</code>），可匯出／匯入 JSON。
    </div>

    <div class="toolbar">
        <button class="btn btn-tab active" data-src="all" onclick="setSource('all')">全部</button>
        <button class="btn btn-tab" data-src="frozen" onclick="setSource('frozen')">冷凍品</button>
        <button class="btn btn-tab" data-src="chilled" onclick="setSource('chilled')">冷藏/常溫</button>
        <button class="btn btn-tab" data-src="beef" onclick="setSource('beef')">冷藏牛</button>
        <input class="search" id="search" placeholder="搜尋品名／批號…" oninput="render()">
        <label style="font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="hideZero" onchange="render()"> 隱藏 0 庫存
        </label>
        <button class="btn" onclick="exportMap()">📥 匯出對應</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">📤 匯入對應</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importMap(event)">
        <a class="btn btn-main" href="https://mingfonglpg-bit.github.io/-/ANDROID67_SYNC.html" target="_blank">開庫位系統</a>
    </div>

    <div class="stats" id="stats">載入中…</div>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>品項（點擊連結）</th>
                    <th>庫存</th>
                    <th>批號 / 效期</th>
                    <th>對應庫位</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="5" style="text-align:center; color:var(--dim); padding:30px;">讀取 CSV…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 手動對應彈窗 -->
<div class="modal" id="mapModal">
    <div class="modal-box">
        <h3>📍 手動對應庫位</h3>
        <p id="mapItemName" style="font-size:14px; margin:0 0 14px; color:var(--text);"></p>
        <label>區域</label>
        <select id="mapZone">
            <option value="極冷庫-左">極冷庫-左</option>
            <option value="極冷庫-右">極冷庫-右</option>
            <option value="冷藏庫-左">冷藏庫-左</option>
            <option value="冷藏庫-右">冷藏庫-右</option>
            <option value="常溫區">常溫區</option>
            <option value="乾式熟成-左">乾式熟成-左</option>
            <option value="乾式熟成-右">乾式熟成-右</option>
        </select>
        <label>樓層</label>
        <select id="mapFloor">
            <option value="1F">1F</option>
            <option value="2F">2F</option>
            <option value="3F">3F</option>
            <option value="4F">4F</option>
        </select>
        <label>儲位編號</label>
        <input type="number" id="mapPos" min="1" max="200" placeholder="例如 12">
        <div class="row-btns">
            <button class="btn" onclick="closeMapModal()">取消</button>
            <button class="btn" style="background:#7f1d1d;" onclick="clearMap()">清除對應</button>
            <button class="btn btn-main" onclick="saveMap()">儲存</button>
        </div>
    </div>
</div>

<!-- 數量編輯彈窗：COUNT2 修改後會同步到 Android67 同一瀏覽器的其他分頁 -->
<div class="modal" id="qtyModal">
  <div class="modal-box">
    <h3>🔢 修改庫存數量</h3>
    <p id="qtyItemName" style="margin:0 0 14px;font-weight:700"></p>
    <label>目前數量</label>
    <input type="number" id="qtyInput" min="0" step="0.01">
    <div class="row-btns">
      <button class="btn" onclick="closeQtyModal()">取消</button>
      <button class="btn btn-main" onclick="saveQtyOverride()">儲存並同步</button>
    </div>
  </div>
</div>

<script>
const ANDROID12 = 'https://mingfonglpg-bit.github.io/-1-1/android12.html';
const BASE = 'https://mingfonglpg-bit.github.io/-/';

const CONFIG = {
    frozen:  { file: BASE + 'frozen.csv',  name: 0, qty: 1, batch: 2, date: 3, label: '冷凍' },
    chilled: { file: BASE + 'chilled.csv', name: 0, qty: 1, batch: 2, date: 3, label: '冷藏/常溫' },
    beef:    { file: BASE + 'beef.csv',    name: 2, qty: 3, batch: 0, date: 1, label: '冷藏牛' }
};

let allItems = [];
let currentSource = 'all';
let mapSlot = {}; // name -> { zone, floor, pos }
let editingName = null;
let editingQtyKey = null;
let qtyOverrides = {};
try { qtyOverrides = JSON.parse(localStorage.getItem('warehouse_count_qty_overrides') || '{}') || {}; } catch(e) { qtyOverrides = {}; }
function qtyKey(item){ return `${item.source}|${item.name}`; }
function getEffectiveQty(item){ const k=qtyKey(item); return Object.prototype.hasOwnProperty.call(qtyOverrides,k) ? parseNum(qtyOverrides[k]) : item.qty; }
function saveQtyStore(){ localStorage.setItem('warehouse_count_qty_overrides', JSON.stringify(qtyOverrides)); localStorage.setItem('warehouse_count_qty_updated_at', String(Date.now())); window.dispatchEvent(new Event('warehouseCountQtyChanged')); }
function openQtyModal(item){ editingQtyKey=qtyKey(item); document.getElementById('qtyItemName').textContent=`${item.name}（${item.sourceLabel}）`; document.getElementById('qtyInput').value=getEffectiveQty(item); document.getElementById('qtyModal').style.display='flex'; }
function closeQtyModal(){ document.getElementById('qtyModal').style.display='none'; editingQtyKey=null; }
function saveQtyOverride(){ if(!editingQtyKey)return; const v=parseFloat(document.getElementById('qtyInput').value); if(!Number.isFinite(v)||v<0){alert('請輸入 0 以上的數量');return;} qtyOverrides[editingQtyKey]=v; saveQtyStore(); try { localStorage.setItem('warehouse_count_catalog', JSON.stringify(allItems.map(it=>({source:it.source,sourceLabel:it.sourceLabel,name:it.name,qty:getEffectiveQty(it)})))); localStorage.setItem('warehouse_count_catalog_updated_at',String(Date.now())); } catch(e){} closeQtyModal(); render(); }
window.addEventListener('storage',e=>{ if(e.key==='warehouse_count_qty_overrides'){try{qtyOverrides=JSON.parse(e.newValue||'{}')||{};}catch(_){qtyOverrides={};} render();} });
window.addEventListener('warehouseCountQtyChanged',()=>render());

try {
    mapSlot = JSON.parse(localStorage.getItem('count_slot_map') || '{}') || {};
} catch (e) { mapSlot = {}; }

function saveSlotStore() {
    localStorage.setItem('count_slot_map', JSON.stringify(mapSlot));
}

function parseNum(v) {
    if (v == null || v === '') return 0;
    const n = parseFloat(String(v).replace(/,/g, ''));
    return isNaN(n) ? 0 : n;
}

function loadCsv(key) {
    const cfg = CONFIG[key];
    return new Promise((resolve) => {
        Papa.parse(cfg.file + '?t=' + Date.now(), {
            download: true,
            skipEmptyLines: true,
            complete: (res) => {
                const rows = res.data || [];
                const out = [];
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r || !r.length) continue;
                    const name = (r[cfg.name] || '').toString().trim();
                    if (!name) continue;
                    out.push({
                        source: key,
                        sourceLabel: cfg.label,
                        name,
                        qty: parseNum(r[cfg.qty]),
                        batch: (r[cfg.batch] || '').toString().trim(),
                        date: (r[cfg.date] || '').toString().trim()
                    });
                }
                resolve(out);
            },
            error: () => resolve([])
        });
    });
}

async function loadAll() {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--dim);padding:30px;">讀取 CSV…</td></tr>';
    const [f, c, b] = await Promise.all([loadCsv('frozen'), loadCsv('chilled'), loadCsv('beef')]);
    allItems = [...f, ...c, ...b];
    // 同名合併數量（保留第一筆批號效期作顯示）
    const map = new Map();
    allItems.forEach(it => {
        const k = it.name + '|' + it.source;
        if (!map.has(k)) map.set(k, { ...it });
        else map.get(k).qty += it.qty;
    });
    allItems = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    // 提供給 ANDROID67：COUNT2 品項目錄與目前有效數量，供管理員點擊品名後綁定。
    try {
        const catalog = allItems.map(it => ({ source: it.source, sourceLabel: it.sourceLabel, name: it.name, qty: getEffectiveQty(it) }));
        localStorage.setItem('warehouse_count_catalog', JSON.stringify(catalog));
        localStorage.setItem('warehouse_count_catalog_updated_at', String(Date.now()));
    } catch(e) { console.warn('COUNT2 品項目錄寫入失敗', e); }
    // 同名同來源合併後，若有人工覆寫，套用人工數量
    allItems.forEach(it => { if (Object.prototype.hasOwnProperty.call(qtyOverrides, qtyKey(it))) it.qty = parseNum(qtyOverrides[qtyKey(it)]); });
    render();
}

function setSource(src) {
    currentSource = src;
    document.querySelectorAll('.btn-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.src === src);
    });
    render();
}

function buildLink(item) {
    const m = mapSlot[item.name];
    if (m && m.zone && m.floor && m.pos) {
        const slot = encodeURIComponent(`${m.zone}|${m.floor}|${m.pos}`);
        return `${ANDROID12}?slot=${slot}`;
    }
    return `${ANDROID12}?q=${encodeURIComponent(item.name)}`;
}

function render() {
    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    const hideZero = document.getElementById('hideZero').checked;
    let list = allItems.filter(it => {
        if (currentSource !== 'all' && it.source !== currentSource) return false;
        if (hideZero && getEffectiveQty(it) <= 0) return false;
        if (!q) return true;
        return it.name.toLowerCase().includes(q) || (it.batch || '').toLowerCase().includes(q);
    });

    document.getElementById('stats').textContent =
        `顯示 ${list.length} 筆（來源共 ${allItems.length} 筆）· 已對應 ${Object.keys(mapSlot).length} 個品名`;

    const tbody = document.getElementById('tbody');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--dim);padding:28px;">沒有符合的資料</td></tr>';
        return;
    }

    tbody.innerHTML = list.map(it => {
        const m = mapSlot[it.name];
        const slotHtml = m
            ? `<span class="slot-tag">${m.zone} ${m.floor}-${m.pos}</span>`
            : `<span class="slot-empty">尚未對應</span>`;
        const link = buildLink(it);
        return `<tr>
            <td>
                <a class="name-link" href="${link}" target="_blank" title="開啟庫位系統">${escapeHtml(it.name)}</a>
                <div class="source">${it.sourceLabel}</div>
            </td>
            <td><div class="qty-edit-wrap"><span class="qty ${getEffectiveQty(it) <= 0 ? 'zero' : ''}">${getEffectiveQty(it)}</span><button class="qty-save" onclick='openQtyModal(${JSON.stringify(it)})'>✏️</button></div></td>
            <td>
                <div>${escapeHtml(it.batch || '—')}</div>
                <div class="source">${escapeHtml(it.date || '')}</div>
            </td>
            <td>${slotHtml}</td>
            <td>
                <button class="btn map-btn" onclick='openMapModal(${JSON.stringify(it.name)})'>對應</button>
            </td>
        </tr>`;
    }).join('');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openMapModal(name) {
    editingName = name;
    document.getElementById('mapItemName').textContent = name;
    const m = mapSlot[name];
    if (m) {
        document.getElementById('mapZone').value = m.zone || '極冷庫-左';
        document.getElementById('mapFloor').value = m.floor || '1F';
        document.getElementById('mapPos').value = m.pos || '';
    } else {
        document.getElementById('mapZone').value = '極冷庫-左';
        document.getElementById('mapFloor').value = '1F';
        document.getElementById('mapPos').value = '';
    }
    document.getElementById('mapModal').style.display = 'flex';
}

function closeMapModal() {
    document.getElementById('mapModal').style.display = 'none';
    editingName = null;
}

function saveMap() {
    if (!editingName) return;
    const zone = document.getElementById('mapZone').value;
    const floor = document.getElementById('mapFloor').value;
    const pos = parseInt(document.getElementById('mapPos').value, 10);
    if (!pos || pos < 1) { alert('請輸入有效儲位編號'); return; }
    mapSlot[editingName] = { zone, floor, pos };
    saveSlotStore();
    closeMapModal();
    render();
}

function clearMap() {
    if (!editingName) return;
    delete mapSlot[editingName];
    saveSlotStore();
    closeMapModal();
    render();
}

function exportMap() {
    const blob = new Blob([JSON.stringify(mapSlot, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `count_slot_map_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

function importMap(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const data = JSON.parse(reader.result);
            if (typeof data !== 'object' || Array.isArray(data)) throw new Error('格式錯誤');
            mapSlot = data;
            saveSlotStore();
            render();
            alert('對應表已匯入');
        } catch (err) {
            alert('匯入失敗：' + err.message);
        }
        e.target.value = '';
    };
    reader.readAsText(file);
}

document.getElementById('qtyModal').addEventListener('click', (e) => { if(e.target.id==='qtyModal') closeQtyModal(); });

document.getElementById('mapModal').addEventListener('click', (e) => {
    if (e.target.id === 'mapModal') closeMapModal();
});

loadAll();
</script>
</body>
</html>
